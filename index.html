<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信用卡回饋助理</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="回饋助理">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="container">

  <header>
    <div class="header-label">信用卡回饋計算機 v1.0</div>
    <h1>刷哪張最划算？</h1>
    <p class="subtitle">根據你的消費情境，精確計算持有卡片的回饋排名</p>
  </header>

  <!-- Card List -->
  <div class="card-list-section">
    <div class="card-list-header" onclick="toggleCardList()">
      <div style="display:flex;align-items:center">
        <span class="card-list-title">持有卡片</span>
        <span class="card-list-count" id="card-list-count">0</span>
      </div>
      <span class="card-list-toggle" id="card-list-toggle">▲</span>
    </div>
    <div class="card-list-body hidden" id="card-list-body"></div>
  </div>

  <!-- Input Panel -->
  <div class="input-panel">
    <div class="panel-title">消費情境</div>

    <div class="input-row">
      <div class="field">
        <label>消費金額</label>
        <input type="number" id="amount" placeholder="例：3820" min="1" step="1">
      </div>
      <div class="field">
        <label>消費幣別</label>
        <select id="currency">
          <option value="TWD">TWD 台幣</option>
          <option value="JPY">JPY 日圓</option>
          <option value="USD">USD 美元</option>
          <option value="EUR">EUR 歐元</option>
          <option value="KRW">KRW 韓圓</option>
          <option value="GBP">GBP 英鎊</option>
          <option value="OTHER">其他外幣</option>
        </select>
      </div>
    </div>

    <!-- FX rate row (hidden when TWD) -->
    <div class="fx-row" id="fx-row" style="display:none">
      <span>匯率：1</span>
      <span id="fx-currency-label">JPY</span>
      <span>=</span>
      <input type="number" id="fx-rate" class="fx-input" placeholder="0.22" step="0.001" min="0.001">
      <span>TWD</span>
      <button class="fetch-rate-btn" id="fetch-rate-btn" onclick="fetchFxRate()" title="自動抓取匯率">自動抓取</button>
      <span id="fx-rate-status" style="font-size:11px;color:var(--text3)"></span>
    </div>

    <div class="input-row">
      <div class="field">
        <label>商家 / 消費平台</label>
        <div class="merchant-input-wrap">
          <input type="text" id="merchant" placeholder="例：momo、7-11、Netflix…" autocomplete="off">
          <div class="autocomplete-list" id="autocomplete-list"></div>
        </div>
      </div>
      <div class="field">
        <label>消費地點</label>
        <select id="country">
          <option value="TW">台灣</option>
          <option value="JP">日本</option>
          <option value="KR">韓國</option>
          <option value="US">美國</option>
          <option value="EU">歐洲</option>
          <option value="TH">泰國</option>
          <option value="SG">新加坡</option>
          <option value="OTHER">其他海外</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div class="field">
        <label>消費通路</label>
        <div class="toggle-group" id="channel-group">
          <button class="toggle active" data-val="online" onclick="setToggle('channel-group', this)">線上</button>
          <button class="toggle" data-val="offline" onclick="setToggle('channel-group', this)">實體</button>
        </div>
      </div>
      <div class="field">
        <label>是否假日／國定假日</label>
        <div class="toggle-group" id="weekend-group">
          <button class="toggle active" data-val="weekday" onclick="setToggle('weekend-group', this)">平日</button>
          <button class="toggle" data-val="weekend" onclick="setToggle('weekend-group', this)">假日</button>
        </div>
      </div>
    </div>

    <div class="field" style="margin-bottom:14px">
      <label>支付方式（可複選；不選則自動推薦最佳）</label>
      <div class="toggle-group" id="payment-group">
        <button class="toggle" data-val="line_pay" onclick="toggleMulti(this)">LINE Pay</button>
        <button class="toggle" data-val="apple_pay" onclick="toggleMulti(this)">Apple Pay</button>
        <button class="toggle" data-val="physical_card" onclick="toggleMulti(this)">實體卡</button>
        <button class="toggle" data-val="taishin_pay" onclick="toggleMulti(this)">台新Pay</button>
        <button class="toggle" data-val="paypay" onclick="toggleMulti(this)">PayPay</button>
      </div>
    </div>

    <button class="calc-btn" onclick="calculate()">計算最佳回饋 →</button>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="empty-state">
      <div class="empty-icon">💳</div>
      <div class="empty-text">輸入消費情境後點擊計算<br>即可看到持有卡片的回饋排名</div>
    </div>
  </div>

</div>

<!-- 資料載入順序：卡片權益 → 固定使用者資格 → 計算邏輯 -->
<script src="cards.js"></script>
<script src="userProfile.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
